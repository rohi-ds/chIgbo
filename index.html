<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chIgbo — learn Igbo, three words a day</title>
<meta name="description" content="Learn Igbo: three words a day, a 15-question daily quiz, spaced review and a full searchable dictionary.">
<meta name="theme-color" content="#14100d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314100d'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23d9a05b' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23e8603f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="shell">
  <aside class="side" aria-label="Main">
    <a class="brand" href="#today" aria-label="chIgbo home">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="3.5"/>
        <circle cx="24" cy="24" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4"/>
        <circle class="brand-bead" cx="24" cy="24" r="5"/>
      </svg>
      <span class="brand-word">ch<b>I</b>gbo</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#today" data-route="today"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg><span>Today</span></a>
      <a href="#quiz" data-route="quiz"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>Daily quiz</span><i class="dot" id="navQuizDot" hidden></i></a>
      <a href="#practice" data-route="practice"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="14" rx="2"/><path d="M8 6V4h11a2 2 0 0 1 2 2v12h-2"/></svg><span>Practice</span><em class="count" id="navDue" hidden></em></a>
      <a href="#dictionary" data-route="dictionary"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span>Dictionary</span></a>
      <a href="#progress" data-route="progress"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Progress</span></a>
    </nav>
    <div class="side-foot">
      <div class="streak" id="sideStreak" title="Daily streak"></div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </aside>

  <main id="main" tabindex="-1"></main>
</div>

<dialog id="entryDialog" class="sheet" aria-label="Dictionary entry"></dialog>
<dialog id="formDialog" class="sheet small" aria-label="Add a word"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="cur cur-ring" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="cur cur-dot" aria-hidden="true"></div>

<noscript><p style="padding:2rem">chIgbo needs JavaScript to run.</p></noscript>
<script src="data/dictionary.js"></script>
<script src="js/cursor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
